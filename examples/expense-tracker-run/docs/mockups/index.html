<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>รายรับรายจ่าย (Prototype)</title>
<meta name="description" content="Clickable prototype of the Expense Tracker, direction Banknote. Mock data only.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600&family=Sarabun:wght@400&display=swap" rel="stylesheet">
<style>
/* ===== Design tokens: docs/UXUI_DESIGN.md section 2 (Banknote). Light = :root, dark = .dark, system = media query ===== */
:root{
  --background:#FAF7F0;--foreground:#1C1B18;--card:#FFFFFF;--card-foreground:#1C1B18;--popover:#FFFFFF;--popover-foreground:#1C1B18;
  --primary:#1E5A43;--primary-foreground:#FFFFFF;--secondary:#F2EDE1;--secondary-foreground:#1C1B18;--muted:#F2EDE1;--accent:#F2EDE1;--accent-foreground:#1C1B18;
  --muted-foreground:#5F5A4E;--destructive:#B3261E;--destructive-foreground:#FFFFFF;--border:#E3DCCB;--input:#8C8472;--ring:#1E5A43;
  --slab:#1E5A43;--slab-foreground:#FFFFFF;--slab-muted:#CFE3D8;--slab-frame:#4A8268;--slab-negative:#7A2318;--slab-negative-muted:#F3D4CC;
  --seal:#F2B53A;--seal-foreground:#1C1B18;--income:#2E6B34;--bar:#1E5A43;--bar-track:#E9E2D2;--nav-active:#E3EFE8;
  --warning:#FCEFCB;--warning-foreground:#5C3D00;--warning-border:#E0B85A;
  --card-shadow:0 1px 2px rgba(28,27,24,0.06);--slab-shadow:0 12px 24px -12px rgba(30,90,67,0.55);--fab-shadow:0 6px 16px -4px rgba(28,27,24,0.35);--sheet-shadow:0 -8px 32px rgba(28,27,24,0.18);--scrim:rgba(16,22,19,0.55);
  --font-sans:"Sarabun","Noto Sans Thai",system-ui,sans-serif;--font-display:"Prompt","Sarabun",system-ui,sans-serif;
  --ease-out:cubic-bezier(0.2,0.8,0.2,1);--fast:120ms;--base:200ms;--slow:320ms;
  color-scheme:light;
}
:root.dark{
--background:#101613;--foreground:#ECE8DD;--card:#18201C;--card-foreground:#ECE8DD;--popover:#18201C;--popover-foreground:#ECE8DD;
--primary:#6FCF9F;--primary-foreground:#0B1F15;--secondary:#202A25;--secondary-foreground:#ECE8DD;--muted:#202A25;--accent:#202A25;--accent-foreground:#ECE8DD;
--muted-foreground:#A9A596;--destructive:#FF8A80;--destructive-foreground:#1C1B18;--border:#2E3A34;--input:#7D8A82;--ring:#F2B53A;
--slab:#1D4D3B;--slab-foreground:#FFFFFF;--slab-muted:#CFE3D8;--slab-frame:#3F7A61;--slab-negative:#7A2318;--slab-negative-muted:#F3D4CC;
--seal:#F2B53A;--seal-foreground:#1C1B18;--income:#7FD99A;--bar:#6FCF9F;--bar-track:#2A3530;--nav-active:#1F3A2E;
--warning:#3A2E10;--warning-foreground:#FCE3A6;--warning-border:#6B5520;
--card-shadow:none;--slab-shadow:none;--fab-shadow:0 6px 16px -4px rgba(0,0,0,0.6);--sheet-shadow:0 -8px 32px rgba(0,0,0,0.6);--scrim:rgba(16,22,19,0.55);color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not(.light){
--background:#101613;--foreground:#ECE8DD;--card:#18201C;--card-foreground:#ECE8DD;--popover:#18201C;--popover-foreground:#ECE8DD;
--primary:#6FCF9F;--primary-foreground:#0B1F15;--secondary:#202A25;--secondary-foreground:#ECE8DD;--muted:#202A25;--accent:#202A25;--accent-foreground:#ECE8DD;
--muted-foreground:#A9A596;--destructive:#FF8A80;--destructive-foreground:#1C1B18;--border:#2E3A34;--input:#7D8A82;--ring:#F2B53A;
--slab:#1D4D3B;--slab-foreground:#FFFFFF;--slab-muted:#CFE3D8;--slab-frame:#3F7A61;--slab-negative:#7A2318;--slab-negative-muted:#F3D4CC;
--seal:#F2B53A;--seal-foreground:#1C1B18;--income:#7FD99A;--bar:#6FCF9F;--bar-track:#2A3530;--nav-active:#1F3A2E;
--warning:#3A2E10;--warning-foreground:#FCE3A6;--warning-border:#6B5520;
--card-shadow:none;--slab-shadow:none;--fab-shadow:0 6px 16px -4px rgba(0,0,0,0.6);--sheet-shadow:0 -8px 32px rgba(0,0,0,0.6);--scrim:rgba(16,22,19,0.55);color-scheme:dark;
  }
}

/* ===== Base ===== */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--background);color:var(--foreground);font:400 16px/1.625 var(--font-sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--primary)}
svg.ic{flex:none;display:block}
.money{font-family:var(--font-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.h1{font:600 22px/30px var(--font-display)}
.h2{font:500 18px/26px var(--font-display)}
.cap{font-size:14px;line-height:22px}
.muted{color:var(--muted-foreground)}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.row:focus-visible,.bkrow:focus-visible{outline-offset:-2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:var(--primary);color:var(--primary-foreground);padding:8px 16px;border-radius:10px;z-index:100}
.skip:focus{top:8px}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:10px;border:1px solid transparent;background:transparent;font:500 16px/24px var(--font-display);text-decoration:none;white-space:nowrap;transition:background-color var(--fast),transform var(--fast);color:var(--foreground)}
.btn:active{transform:scale(0.98)}
.btn.primary{background:var(--primary);color:var(--primary-foreground)}
.btn.outline{border-color:var(--input);background:transparent;color:var(--foreground)}
.btn.ghost{color:var(--foreground)}
.btn.icon{width:44px;padding:0}
.btn.danger-outline{border-color:var(--destructive);color:var(--destructive)}
.btn.danger{background:var(--destructive);color:var(--destructive-foreground)}
.btn.lg{height:48px}
.btn[disabled]{opacity:.5;pointer-events:none}
@media (hover:hover){
  .btn.primary:hover{background:color-mix(in srgb,var(--primary) 90%,transparent)}
  .btn.outline:hover,.btn.ghost:hover{background:var(--accent)}
  .btn.danger-outline:hover{background:color-mix(in srgb,var(--destructive) 10%,transparent)}
  .btn.danger:hover{background:color-mix(in srgb,var(--destructive) 90%,transparent)}
  .row:hover,.bkrow:hover{background:var(--accent)}
  .fab:hover{filter:brightness(.95)}
}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== Shell ===== */
.proto-banner{background:var(--secondary);color:var(--muted-foreground);text-align:center;font-size:14px;line-height:22px;padding:4px 16px;border-bottom:1px solid var(--border)}
.proto-banner strong{font-family:var(--font-display);font-weight:500;color:var(--foreground)}
.hdr{position:sticky;top:0;z-index:20;background:var(--background);border-bottom:1px solid var(--border);height:56px}
.hdr-in{max-width:1040px;margin:0 auto;padding:0 16px;height:100%;display:flex;align-items:center;gap:8px}
.wordmark{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--foreground);font:600 18px/26px var(--font-display);margin-right:auto;min-height:44px}
.wordmark .seal{width:28px;height:28px;font-size:16px;line-height:1}
.seal{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--seal);color:var(--seal-foreground);font:600 20px/1 var(--font-display);width:40px;height:40px}
.topnav{display:none;gap:4px}
.topnav a{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:999px;text-decoration:none;color:var(--foreground);font:500 16px/24px var(--font-display)}
.topnav a[aria-current="page"]{background:var(--nav-active);color:var(--primary)}
.add-desktop{display:none}
.themes{display:flex;gap:2px}
.themes button{width:44px;height:44px;border:0;border-radius:999px;background:transparent;color:var(--muted-foreground);display:inline-flex;align-items:center;justify-content:center}
.themes button[aria-pressed="true"]{background:var(--nav-active);color:var(--primary)}
@media (hover:hover){.themes button:hover{background:var(--accent)}}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 160px}
.stack{display:flex;flex-direction:column;gap:24px}
.fab{position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:30;width:56px;height:56px;border-radius:50%;border:2px solid var(--primary);background:var(--seal);color:var(--seal-foreground);display:flex;align-items:center;justify-content:center;box-shadow:var(--fab-shadow);transition:transform var(--fast)}
.fab:active{transform:scale(.95)}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--background);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.bnav a{flex:1;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--muted-foreground);font:500 14px/20px var(--font-display)}
.bnav a .pill{width:56px;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center}
.bnav a[aria-current="page"]{color:var(--primary)}
.bnav a[aria-current="page"] .pill{background:var(--nav-active);color:var(--primary)}
.app.locked{max-height:100dvh;overflow:hidden}
@media (min-width:640px){
  .hdr{height:64px}
  .topnav{display:flex;margin-right:8px}
  .add-desktop{display:inline-flex}
  .wordmark{margin-right:0;margin-left:0}
  .hdr-in{padding:0 24px}
  .hdr-in .spacer{flex:1}
  .wrap{padding:24px 24px 48px}
  .fab,.bnav{display:none}
  .h1{font-size:26px;line-height:34px}
}
@media (min-width:1024px){
  .wrap.home{max-width:1040px}
  .hdr-in{padding:0 32px}
  .wrap{padding:32px 32px 64px}
  .stack{gap:32px}
}

/* ===== Cards, rows ===== */
.card{background:var(--card);color:var(--card-foreground);border:1px solid var(--border);border-radius:14px;box-shadow:var(--card-shadow)}
.card-pad{padding:16px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 8px 4px 16px;min-height:52px}
.tile{width:40px;height:40px;border-radius:50%;background:var(--secondary);color:var(--foreground);display:flex;align-items:center;justify-content:center;flex:none}
.tile.sm{width:32px;height:32px}
.rows>*+*{border-top:1px solid var(--border)}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;column-gap:12px;width:100%;min-height:56px;padding:8px 16px;border:0;background:transparent;text-align:left;color:inherit;border-radius:0;transition:background-color var(--fast)}
.row:active,.bkrow:active{transform:scale(.99)}
.row-main{display:flex;flex-direction:column;min-width:0}
.row-cat{font:500 16px/24px var(--font-display)}
.row-note{font-size:14px;line-height:22px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-amt{font:500 16px/24px var(--font-display)}
.row-amt.income,.income-c{color:var(--income)}
.row.hl{animation:hl 1s ease-out}
@keyframes hl{0%{background:var(--nav-active)}100%{background:transparent}}

/* ===== Month switcher ===== */
.msw{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:0 8px}
.msw .mlabel{font:600 20px/28px var(--font-display);text-align:center;margin:0}
.msw .today{grid-column:1/-1;justify-self:center;margin-top:8px}
@media (min-width:1024px){
  .msw{grid-template-columns:44px minmax(180px,auto) 44px auto;justify-content:start}
  .msw .today{grid-column:auto;margin:0 0 0 8px}
}

/* ===== Slab (signature) ===== */
.slab{position:relative;background:var(--slab);color:var(--slab-foreground);border-radius:20px;padding:24px;min-height:168px;box-shadow:var(--slab-shadow);display:flex;flex-direction:column;justify-content:space-between;gap:16px;transition:background-color var(--base)}
.slab::before{content:"";position:absolute;inset:8px;border:1px solid var(--slab-frame);border-radius:14px;pointer-events:none}
.slab .cap{color:var(--slab-muted)}
.slab.neg{background:var(--slab-negative)}
.slab.neg .cap{color:var(--slab-negative-muted)}
.slab .seal{position:absolute;top:20px;right:20px}
.slab .balance{font:600 clamp(28px,9vw,40px)/1.2 var(--font-display);position:relative}
.badge{display:inline-block;background:var(--seal);color:var(--seal-foreground);font:500 14px/20px var(--font-display);padding:2px 10px;border-radius:8px;margin-left:8px;vertical-align:middle}
.badge.sec{background:var(--secondary);color:var(--secondary-foreground);margin-left:0}
@media (min-width:1024px){.slab .balance{font-size:48px;line-height:56px}}

.ledger .lrow{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 16px}
.ledger .lrow+.lrow{border-top:1px solid var(--border)}
.ledger .llabel{flex:1}
.ledger .total{font:600 20px/28px var(--font-display)}
.ledger .tile{width:32px;height:32px}
.ledger .tile.in{color:var(--income)}
@media (min-width:1024px){.ledger .total{font-size:22px;line-height:30px}}

/* ===== Breakdown ===== */
.bkrow{display:flex;flex-direction:column;gap:8px;width:100%;padding:10px 16px 14px;border:0;background:transparent;text-align:left;min-height:56px;transition:background-color var(--fast)}
.bk-top{display:flex;align-items:center;gap:12px;width:100%}
.bk-label{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:500 16px/24px var(--font-display)}
.bk-amt{flex:none;font:500 16px/24px var(--font-display)}
.bk-pct{flex:none;width:44px;text-align:right;font:500 14px/22px var(--font-display);color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.bk-chev{color:var(--muted-foreground);flex:none}
.bar{display:block;height:8px;border-radius:999px;background:var(--bar-track);overflow:hidden}
.bar .fill{display:block;height:100%;border-radius:999px;background:var(--bar);transform-origin:left;animation:grow var(--slow) var(--ease-out)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* ===== Empty, privacy ===== */
.empty{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding:32px 24px}
.empty.small{padding:0 16px;min-height:72px;justify-content:center;gap:0;color:var(--muted-foreground)}
.empty .seal-o{width:56px;height:56px;border-radius:50%;border:2px solid var(--muted-foreground);color:var(--muted-foreground);display:flex;align-items:center;justify-content:center;font:600 28px/1 var(--font-display)}
.empty .big-ic{color:var(--muted-foreground)}
.privacy{display:flex;align-items:flex-start;justify-content:center;gap:8px;text-align:center;font-size:14px;line-height:22px;color:var(--muted-foreground);padding:0 8px}
.privacy svg{margin-top:3px}
.cols{display:grid;gap:24px}
.cols>div{display:flex;flex-direction:column;gap:24px;min-width:0}
@media (min-width:1024px){.cols{grid-template-columns:7fr 5fr;gap:32px}.cols>div{gap:32px}}

/* ===== List ===== */
.ctrl{display:flex;flex-direction:column;gap:16px}
@media (min-width:1024px){.ctrl{flex-direction:row;align-items:center;justify-content:space-between}}
.wrap.list{max-width:640px}
@media (min-width:1024px){.wrap.list{max-width:784px}}
.sel{position:relative;width:100%}
@media (min-width:640px){.sel{width:288px}}
.sel select{appearance:none;-webkit-appearance:none;width:100%;height:48px;border:1px solid var(--input);border-radius:10px;background:var(--background);padding:0 40px 0 44px;font:500 16px/24px var(--font-display);color:var(--foreground)}
.sel .l{position:absolute;left:14px;top:14px;color:var(--muted-foreground);pointer-events:none}
.sel .r{position:absolute;right:14px;top:14px;color:var(--muted-foreground);pointer-events:none}
.fsum{display:flex;align-items:center;gap:12px;padding:12px 8px 12px 16px;flex-wrap:wrap}
.fsum .lbl{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.fsum .total{font:600 20px/28px var(--font-display)}
.day{position:sticky;top:56px;z-index:5;background:var(--background);font:500 14px/22px var(--font-display);color:var(--muted-foreground);padding:8px 0 8px}
.dayg{display:flex;flex-direction:column}
.groups{display:flex;flex-direction:column;gap:16px}
@media (min-width:640px){.day{top:64px}}

/* ===== Banners and alerts ===== */
.banners{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.banner{display:flex;align-items:flex-start;gap:12px;padding:12px 8px 12px 16px;background:var(--warning);color:var(--warning-foreground);border:1px solid var(--warning-border);border-radius:14px}
.banner p{flex:1;padding-top:10px;font-size:16px;line-height:24px}
.banner p.nc{padding-right:8px;padding-top:2px}
.banner>svg{margin-top:2px}
.banner .btn.ghost{color:var(--warning-foreground)}
.alert-err{display:flex;align-items:flex-start;gap:8px;padding:12px;border:1px solid var(--destructive);border-radius:10px;color:var(--destructive);font-size:14px;line-height:22px}
.alert-err svg{margin-top:2px}
.specimen{border:1px dashed var(--input);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:16px}
.specimen h2{font:500 14px/22px var(--font-display);color:var(--muted-foreground)}
.errcard{display:flex;flex-direction:column;align-items:center;gap:16px;padding:32px 24px;text-align:center}

/* ===== Overlays: sheet (mobile) / dialog (>=640) ===== */
.overlay{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade var(--fast) linear}
.overlay.confirm{z-index:60;align-items:center;padding:16px}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-height:92dvh;overflow-y:auto;background:var(--popover);color:var(--popover-foreground);border-radius:20px 20px 0 0;box-shadow:var(--sheet-shadow);display:flex;flex-direction:column;animation:up var(--base) var(--ease-out)}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:999px;background:var(--border);margin:8px auto 0;flex:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 0 24px;flex:none}
.sheet-body{padding:12px 24px 16px;display:flex;flex-direction:column;gap:20px}
.sheet-foot{position:sticky;bottom:0;background:var(--popover);border-top:1px solid var(--border);padding:12px 24px calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;margin-top:auto;flex:none}
.sheet-foot .btn{height:48px;padding:0 16px}
.sheet-foot .grow{flex:1}
.still,.still .sheet,.still .alertdlg{animation:none}
@media (min-width:640px){
  .overlay{align-items:center;padding:24px}
  .sheet{max-width:480px;max-height:calc(100dvh - 48px);border-radius:14px}
  .grab{display:none}
  .sheet-head{padding-top:20px}
  .sheet-foot{position:static;border-top:0;padding-top:0;justify-content:flex-end}
  .sheet-foot .grow{flex:none;min-width:120px}
  .sheet-foot .del{margin-right:auto}
}
.field{display:flex;flex-direction:column;gap:8px}
.field>label,.field>.lab{font:500 16px/24px var(--font-display)}
.field .opt{font:400 14px/22px var(--font-sans);color:var(--muted-foreground)}
.inp{width:100%;border:1px solid var(--input);border-radius:10px;background:transparent;height:48px;padding:0 12px;font:400 16px/26px var(--font-sans);color:var(--foreground)}
textarea.inp{height:auto;padding:10px 12px;resize:none;line-height:26px}
.amt-wrap{position:relative}
.amt-wrap .prefix{position:absolute;left:16px;top:50%;transform:translateY(-50%);font:600 36px/44px var(--font-display);color:var(--muted-foreground);pointer-events:none}
.amt-wrap .inp{height:64px;font:600 36px/44px var(--font-display);padding-left:44px;font-variant-numeric:tabular-nums}
.inp[aria-invalid="true"],.chips[aria-invalid="true"]{border-color:var(--destructive)}
.inp[aria-invalid="true"]:focus-visible{outline-color:var(--destructive)}
.chips[aria-invalid="true"]{border:1px solid var(--destructive);border-radius:14px;padding:6px}
.err{display:flex;align-items:flex-start;gap:6px;color:var(--destructive);font-size:14px;line-height:22px}
.err svg{margin-top:3px}
.counter{text-align:right;font-size:14px;line-height:22px;color:var(--muted-foreground)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border:1px solid var(--input);border-radius:12px}
.seg button{height:48px;border:0;border-radius:9px;background:transparent;color:var(--foreground);display:flex;align-items:center;justify-content:center;gap:8px;font:500 16px/24px var(--font-display)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-foreground)}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chip{position:relative;height:64px;border:0;border-radius:20px;background:var(--secondary);color:var(--secondary-foreground);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:500 14px/20px var(--font-display);padding:0 4px;transition:transform var(--fast)}
.chip:active{transform:scale(.98)}
.chip span.t{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--primary-foreground)}
.chip .ck{position:absolute;top:6px;right:8px}
@media (hover:hover){.chip[aria-pressed="false"]:hover{background:color-mix(in srgb,var(--secondary) 88%,var(--foreground))}}

.alertdlg{width:100%;max-width:400px;background:var(--popover);color:var(--popover-foreground);border:1px solid var(--border);border-radius:14px;box-shadow:var(--sheet-shadow);padding:24px;display:flex;flex-direction:column;gap:12px;animation:pop var(--fast) var(--ease-out)}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.alertdlg h1{font:600 20px/28px var(--font-display)}
.dlg-foot{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.dlg-foot .btn{height:48px}
@media (min-width:640px){.dlg-foot{flex-direction:row-reverse;justify-content:flex-start}.dlg-foot .btn{height:44px}}

/* ===== Toast ===== */
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,16px);z-index:80;background:var(--popover);color:var(--popover-foreground);border:1px solid var(--border);border-radius:14px;box-shadow:var(--sheet-shadow);padding:12px 20px;font:500 16px/24px var(--font-display);opacity:0;pointer-events:none;transition:opacity var(--base),transform var(--base) var(--ease-out);display:flex;align-items:center;gap:8px}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:640px){.toast{bottom:24px}}

/* ===== Skeleton ===== */
.sk{background:var(--muted);border-radius:14px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}

/* ===== Prototype-only state switcher ===== */
.sw{position:fixed;left:12px;bottom:84px;z-index:40;font-size:14px;line-height:22px}
.sw>button.toggle{height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--input);background:var(--card);color:var(--foreground);font:500 14px/20px var(--font-display);box-shadow:var(--fab-shadow);display:flex;align-items:center;gap:6px}
.sw .panel{position:absolute;left:0;bottom:48px;width:min(300px,calc(100vw - 24px));max-height:70dvh;overflow:auto;background:var(--card);color:var(--card-foreground);border:1px solid var(--border);border-radius:14px;box-shadow:var(--sheet-shadow);padding:12px;display:flex;flex-direction:column;gap:10px}
.sw fieldset{border:0;margin:0;padding:0}
.sw legend{font:500 14px/20px var(--font-display);color:var(--muted-foreground);padding:0 0 4px}
.sw .opts{display:flex;flex-wrap:wrap;gap:6px}
.sw .opts button{height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--input);background:transparent;font:500 14px/20px var(--font-display);color:var(--foreground)}
.sw .opts button[aria-pressed="true"]{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
.sw .note{color:var(--muted-foreground);font-size:14px;line-height:22px}
@media (min-width:640px){.sw{bottom:16px}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  .btn:active,.chip:active,.row:active,.bkrow:active,.fab:active{transform:none}
}

/* ===== State ===== */
const params = new URLSearchParams(location.search);
const scn = { fill: params.get('fill'), errors: params.get('errors'), edit: params.get('edit') };
const DEFAULT_EDIT_ID = 'd1';
const state = {
  route: 'home', view: 'home', month: params.get('month') || CUR_MONTH, cat: params.get('cat') || 'all',
  txs: params.get('data') === 'empty' ? [] : makeDemo(), data: params.get('data') === 'empty' ? 'empty' : 'demo',
  storage: params.get('storage') || 'ok', saveFail: params.get('save') === 'fail', mode: params.get('mode') || 'normal',
  form: null, confirm: false, theme: 'system', dismissCorrupt: false, swOpen: false, hl: null, opener: null, focusKey: null, seq: 0
};
try { const t = localStorage.getItem('expense-tracker:theme'); if (t === 'light' || t === 'dark' || t === 'system') state.theme = t; } catch (e) { /* storage may be blocked */ }
if (params.get('theme')) state.theme = params.get('theme');

const ROUTES = ['home', 'list', 'entry-form', 'delete-confirm', 'storage-alerts'];
const $app = document.getElementById('app'), $ov = document.getElementById('overlay'), $toast = document.getElementById('toast'), $sw = document.getElementById('sw');

/* ===== Derived values ===== */
const monthTxs = (ym) => state.txs.filter((t) => t.date.slice(0, 7) === ym);
const byRecent = (a, b) => (a.date !== b.date ? (a.date < b.date ? 1 : -1) : (a.createdAt < b.createdAt ? 1 : a.createdAt > b.createdAt ? -1 : 0));
function totals(ym) {
  const list = monthTxs(ym); let income = 0, expense = 0;
  list.forEach((t) => { if (t.type === 'income') income += t.amount; else expense += t.amount; });
  return { income, expense, balance: income - expense, list };
}
function breakdown(list, totalExpense) {
  const m = {};
  list.filter((t) => t.type === 'expense').forEach((t) => { m[t.categoryId] = (m[t.categoryId] || 0) + t.amount; });
  return Object.entries(m).filter(([, a]) => a > 0).sort((x, y) => y[1] - x[1])
    .map(([id, amount]) => ({ id, amount, pct: Math.floor((amount * 200 + totalExpense) / (2 * totalExpense)), width: (amount * 100 / totalExpense).toFixed(2) }));
}

/* ===== Theme ===== */
function applyTheme() {
  const r = document.documentElement;
  r.classList.remove('light', 'dark');
  if (state.theme === 'light') r.classList.add('light');
  if (state.theme === 'dark') r.classList.add('dark');
  try { localStorage.setItem('expense-tracker:theme', state.theme); } catch (e) { /* ignore */ }
}

    </div>
    <div class="sheet-foot">${edit ? `<button type="button" class="btn danger-outline del" data-action="askdelete" data-fkey="del">${ic('Trash2', 18)}ลบ</button>` : ''}<button type="button" class="btn outline" data-action="close">ยกเลิก</button><button type="submit" class="btn primary grow" ${f.saving ? 'disabled aria-busy="true"' : ''}>${f.saving ? ic('LoaderCircle', 18, 'spin') : ''}บันทึก</button></div>
  </form>`;
  return `<div class="overlay${still ? ' still' : ''}" data-scrim>${sheet}</div>`;
}
function confirmHtml(still) {
  const f = state.form; if (!f || !state.confirm) return '';
  const t = state.txs.find((x) => x.id === f.id) || state.txs[0];
  const c = catOf(t.categoryId);
  return `<div class="overlay confirm${still ? ' still' : ''}" data-scrim-confirm><div class="alertdlg" data-screen="delete-confirm" role="alertdialog" aria-modal="true" aria-labelledby="del-title" aria-describedby="del-desc"><h1 id="del-title">${MESSAGES.deleteConfirm}</h1><p id="del-desc" class="muted">${c.label} · ${signedText(t)} · ${formatDayTh(t.date)}</p><div class="dlg-foot"><button type="button" class="btn danger" data-action="confirmdelete">${ic('Trash2', 18)}ลบ</button><button type="button" class="btn outline" data-action="canceldelete" data-fkey="cancel-del">ยกเลิก</button></div></div></div>`;
}
function renderOverlay() {
  const formWas = !!$ov.querySelector('[data-scrim]'), confWas = !!$ov.querySelector('[data-scrim-confirm]');
  const sh = $ov.querySelector('.sheet'); const top = sh ? sh.scrollTop : 0;
  $ov.innerHTML = formHtml(formWas) + confirmHtml(confWas);
  const ns = $ov.querySelector('.sheet'); if (ns && top) ns.scrollTop = top;
}
function refocus(key) { state.focusKey = key; renderOverlay(); applyFocus(); }

/* ===== State switcher (prototype only) ===== */
function renderSwitcher() {
  const o = (action, v, label, cur) => `<button type="button" data-action="${action}" data-v="${v}" aria-pressed="${cur === v}">${label}</button>`;
  $sw.innerHTML = `<button type="button" class="toggle" data-action="swtoggle" aria-expanded="${state.swOpen}" aria-controls="sw-panel">State</button>${state.swOpen ? `<div class="panel" id="sw-panel" role="group" aria-label="State switcher (prototype)">
    <fieldset><legend>ข้อมูล</legend><div class="opts">${o('sw-data', 'demo', 'ตัวอย่าง', state.data)}${o('sw-data', 'empty', 'ว่าง (ยังไม่มีรายการ)', state.data)}</div></fieldset>
    <fieldset><legend>ที่เก็บข้อมูล</legend><div class="opts">${o('sw-storage', 'ok', 'ปกติ', state.storage)}${o('sw-storage', 'unavailable', 'ใช้ไม่ได้', state.storage)}${o('sw-storage', 'corrupt', 'ข้อมูลเสีย', state.storage)}</div></fieldset>
    <fieldset><legend>การบันทึก</legend><div class="opts">${o('sw-save', 'ok', 'สำเร็จ', state.saveFail ? 'fail' : 'ok')}${o('sw-save', 'fail', 'ล้มเหลว', state.saveFail ? 'fail' : 'ok')}</div></fieldset>
    <fieldset><legend>หน้าจอ</legend><div class="opts">${o('sw-mode', 'normal', 'ปกติ', state.mode)}${o('sw-mode', 'loading', 'กำลังโหลด', state.mode)}${o('sw-mode', 'error', 'Error', state.mode)}</div></fieldset>
    <p class="note">ดูหน้าเตือนที่เก็บข้อมูล: <a href="#storage-alerts">storage-alerts</a></p></div>` : ''}`;
}

/* ===== Forms ===== */
function blankDraft() { return { type: 'expense', amount: '', categoryId: '', date: TODAY, note: '' }; }
function newForm() {
  const f = { mode: 'add', id: null, draft: blankDraft(), errors: {}, saving: false, saveError: false };
  if (scn.fill) { f.draft = { type: 'expense', amount: '150', categoryId: 'food', date: TODAY, note: 'ข้าวมันไก่' }; }
  if (scn.errors) { f.draft = { type: 'expense', amount: '10.555', categoryId: '', date: '', note: '' }; f.errors = validate(f.draft).errors; f.focus = 'amount'; }
  scn.fill = scn.errors = null;
  return f;
}
function editForm(id) {
  const t = state.txs.find((x) => x.id === id) || state.txs[0];
  if (!t) return newForm();
  scn.edit = null;
  return { mode: 'edit', id: t.id, draft: { type: t.type, amount: satangToInput(t.amount), categoryId: t.categoryId, date: t.date, note: t.note }, errors: {}, saving: false, saveError: false };
}
function validate(d) {
  const errors = {}; let satang = 0;
  const a = parseAmount(d.amount);
  if (a.error) errors.amount = MESSAGES[a.error]; else satang = a.satang;
  if (!d.categoryId) errors.category = MESSAGES.categoryRequired;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d.date) || d.date < '2000-01-01' || d.date > '2099-12-31') errors.date = MESSAGES.dateRequired;
  return { errors, satang };
}
function submitForm() {
  const f = state.form; if (!f || f.saving) return;
  const { errors, satang } = validate(f.draft);
  f.errors = errors; f.saveError = false;
  if (Object.keys(errors).length) {
    refocus(errors.amount ? 'amount' : errors.category ? 'chip-' + CATS.find((c) => c.type === f.draft.type).id : 'date'); return;
  }
  f.saving = true; renderOverlay();
  setTimeout(() => {
    if (!state.form) return;
    if (state.saveFail) { f.saving = false; f.saveError = true; renderOverlay(); return; }
    const note = f.draft.note.trim(); const now = new Date(Date.UTC(2026, 9, 9, 13, 0, 0 + (++state.seq))).toISOString();
    if (f.mode === 'edit') {
      const t = state.txs.find((x) => x.id === f.id);
      Object.assign(t, { type: f.draft.type, categoryId: f.draft.categoryId, amount: satang, date: f.draft.date, note, updatedAt: now });
      state.hl = t.id;
    } else {
      const t = { id: 'n' + state.seq, type: f.draft.type, categoryId: f.draft.categoryId, amount: satang, date: f.draft.date, note, createdAt: now };
      state.txs.push(t); state.hl = t.id;
    }
    state.form = null; state.confirm = false; go(state.view); toast(MESSAGES.saved);
    setTimeout(() => { state.hl = null; document.querySelectorAll('.row.hl').forEach((r) => r.classList.remove('hl')); }, 1100);
  }, 450);
}

/* ===== Routing ===== */
function onRoute() {
  const h = location.hash.replace(/^#\/?/, '').split('?')[0];
  const r = ROUTES.includes(h) ? h : 'home';
  state.route = r;
  if (r === 'home' || r === 'list') { state.view = r; state.form = null; state.confirm = false; }
  else if (r === 'storage-alerts') { state.view = 'home'; state.form = null; state.confirm = false; }
  else if (r === 'entry-form') { if (!state.form) state.form = scn.edit ? editForm(scn.edit) : newForm(); state.confirm = false; }
  else if (r === 'delete-confirm') { if (!state.form || state.form.mode !== 'edit') state.form = editForm(scn.edit || DEFAULT_EDIT_ID); state.confirm = true; }
  if (state.form && !state.form.focus && r === 'entry-form') state.form.focus = 'amount';
  render();
}
function go(r) { const t = '#' + r; if (location.hash === t) onRoute(); else location.hash = t; }
function render() {
  renderApp(); renderOverlay(); renderSwitcher();
  if (state.form && state.confirm) state.focusKey = 'cancel-del';
  else if (state.form && state.form.focus) { state.focusKey = state.form.focus; state.form.focus = null; }
  else if (!state.form && state.opener) { state.focusKey = state.opener; state.opener = null; }
  applyFocus();
}
function applyFocus() {
  if (!state.focusKey) return;
  const el = document.querySelector(`[data-fkey="${state.focusKey}"]`);
  state.focusKey = null;
  if (el) el.focus({ preventScroll: true });
}
function toast(msg) {
  $toast.innerHTML = msg; $toast.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => $toast.classList.remove('show'), 2500);
}

/* ===== Events ===== */
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-action]'); if (!el) return;
  const a = el.dataset.action, v = el.dataset.v;
  switch (a) {
    case 'prev': state.month = addMonth(state.month, -1); render(); break;
    case 'next': state.month = addMonth(state.month, 1); render(); break;
    case 'today': state.month = CUR_MONTH; render(); break;
    case 'add': state.opener = el.dataset.fkey || null; state.form = null; go('entry-form'); break;
    case 'edit': state.opener = el.dataset.fkey || null; state.form = editForm(el.dataset.id); state.form.focus = 'amount'; go('entry-form'); break;
    case 'all': state.cat = 'all'; go('list'); break;
    case 'cat': state.cat = el.dataset.cat; go('list'); break;
    case 'clear': state.cat = 'all'; render(); break;
    case 'close': if (state.route === 'delete-confirm') { go('entry-form'); } else { state.form = null; go(state.view); } break;
    case 'type': { const f = state.form; f.draft.type = v; const c = catOf(f.draft.categoryId); if (c && c.type !== v) f.draft.categoryId = ''; f.errors.category = ''; refocus('type-' + v); break; }
    case 'pick': { const f = state.form; f.draft.categoryId = el.dataset.cat; f.errors.category = ''; refocus('chip-' + el.dataset.cat); break; }
    case 'askdelete': go('delete-confirm'); break;
    case 'canceldelete': go('entry-form'); break;
    case 'confirmdelete': { const id = state.form.id; state.txs = state.txs.filter((t) => t.id !== id); state.form = null; state.confirm = false; go(state.view); toast(MESSAGES.deleted); break; }
    case 'dismiss': state.dismissCorrupt = true; render(); break;
    case 'reload': state.mode = 'normal'; render(); break;
    case 'theme': state.theme = v; applyTheme(); render(); break;
    case 'swtoggle': state.swOpen = !state.swOpen; renderSwitcher(); break;
    case 'sw-data': state.data = v; state.txs = v === 'empty' ? [] : makeDemo(); render(); break;
    case 'sw-storage': state.storage = v; state.dismissCorrupt = false; render(); break;
    case 'sw-save': state.saveFail = v === 'fail'; renderSwitcher(); break;
    case 'sw-mode': state.mode = v; render(); break;
    default: break;
  }
});
document.addEventListener('input', (ev) => {
  const el = ev.target; const f = state.form; if (!f || !el.dataset) return;
  if (el.dataset.field === 'amount') f.draft.amount = el.value;
  if (el.dataset.field === 'date') f.draft.date = el.value;
  if (el.dataset.field === 'note') {
    const limited = limitNote(el.value); if (limited !== el.value) el.value = limited;
    f.draft.note = limited; document.getElementById('f-note-count').textContent = cpLen(limited.trim()) + '/200';
  }
});
document.addEventListener('change', (ev) => { if (ev.target.dataset && ev.target.dataset.field === 'filter') { state.cat = ev.target.value; render(); } });
document.addEventListener('submit', (ev) => { if (ev.target.matches('[data-form]')) { ev.preventDefault(); submitForm(); } });
document.addEventListener('keydown', (ev) => {
  if (ev.key !== 'Escape') return;
  if (state.confirm) { go('entry-form'); } else if (state.form) { state.form = null; go(state.view); }
});
window.addEventListener('hashchange', onRoute);

applyTheme();
if (!location.hash) history.replaceState(null, '', '#home');
onRoute();
</script>
</body>
</html>
